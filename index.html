<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog</title>
    <style>
        header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
background-color: #CFFFD2;
color: #000000
}
main {
    background-color: #CFFFD2;
    color: #000000; 
            max-width: 800px;
            margin: 0 auto;
            display: flex;
}
img {
    width: 80px;
    height: 80px;
}
.artigo-autor {
    font-weight: bold;
}
    </style>
</head>
<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>
    <main>
        <img src="imagem-blog.png" alt="Ícone em preto sobre fundo verde-claro representando tecnologia e educação, composto por um livro aberto com uma lâmpada acesa no centro">
        <div>
    <h2>Meu primeiro post</h2>
    <p class="artigo-autor">Por: João Matheus</p>
    <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
    <button>❤️<span>0</span></button>
    <button>👍<span>0</span></button>
</div>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");
    botoes.forEach(function(botao) {
        let curtiu = false;
    botao.addEventListener("click", botaoClicado);
    function botaoClicado() {
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        if (curtiu === false){
        texto.textContent++;
        curtiu = true;  
        } else {
            texto.textContent--;
            curtiu = false;
        }
    }
});
botao.addEventListener("click", botaoClicado);
function botaoClicado() {
    console.log("fui clicado");
    let texto = botao.querySelector("span");
    texto.textContent++;
}

</script>
</html>
